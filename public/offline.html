<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#102a43">
    <title>SISBAR — Sem conexão</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f7f8fa;color:#0f172a;font-family:Inter,Segoe UI,Arial,sans-serif}.card{width:min(100%,420px);padding:32px;border:1px solid #e2e8f0;border-radius:18px;background:#fff;text-align:center}.icon{display:grid;width:56px;height:56px;margin:0 auto;place-items:center;border-radius:16px;background:#102a43;color:#fff;font-size:24px;font-weight:900}h1{margin:20px 0 8px;font-size:24px;color:#102a43}p{margin:0;color:#64748b;line-height:1.6}button{margin-top:24px;padding:12px 20px;border:0;border-radius:10px;background:#ef7d22;color:#fff;font:inherit;font-weight:700}
    </style>
  </head>
  <body><main class="card"><div class="icon">S</div><h1>Você está sem conexão</h1><p>Reconecte-se para carregar os produtos e registrar retiradas com segurança.</p><button onclick="location.reload()">Tentar novamente</button></main></body>
</html>
